on: [push, workflow_dispatch]

jobs:
  deploy:
    runs-on: codeberg-tiny
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
      - uses: https://github.com/noClaps/blackrock@master
      - run: blackrock --version
      - run: make -j
      - run: ls -R dist/
      - uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://zerolimits.dev/
          server: codeberg.page
          token: ${{ forge.token }}
          source: dist/
          pretty-urls: true

on: [push, workflow_dispatch]

jobs:
  deploy:
    runs-on: codeberg-medium-lazy
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
      - uses: https://github.com/typst-community/setup-typst@v5
      - uses: https://code.forgejo.org/actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make -j
      - uses: https://github.com/cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zerolimits-dev

<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <link
            rel="alternate"
            href="/blog/feed.atom"
            type="application/atom+xml"
            data-external="1"
        />
        <link rel="icon" href="homepage/favicon.png" />
        <link rel="stylesheet" href="homepage/global.css" />
        <link rel="stylesheet" href="blog/styles/index.css" />
        <title>The Blog of Random</title>
    </head>
    <body>
        <header>
            <h1>&ZeroWidthSpace;</h1>
            <nav>
                <a href="/">Homepage</a>
                <a href="/gallery/">Gallery</a>
            </nav>
        </header>
        <main>
            <div class="title">
                <h1>The Blog of Random</h1>
                <p>A blog about the most random things you can think of.</p>
            </div>
            <section>
                $for(posts)$
                <a href="$it.url$" class="link">
                    <time datetime="$it.date$">$it.date$</time>
                    <h3>$it.title$</h3>
                </a>
                $endfor$
            </section>
        </main>
    </body>
</html>

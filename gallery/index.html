<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <link rel="icon" href="homepage/favicon.png" />
        <link rel="stylesheet" href="homepage/global.css" />
        <link rel="stylesheet" href="gallery/style.css" />
        <style></style>
        <title>Aperturic Focus</title>
    </head>
    <body>
        <header>
            <h1>&ZeroWidthSpace;</h1>
            <nav>
                <a href="/">Homepage</a>
                <a href="/blog/">Blog</a>
            </nav>
        </header>
        <main>
            <div class="title">
                <h1>Aperturic Focus</h1>
                <p>A website to showcase some cool photos I've taken.</p>
            </div>
            $for(years)$
            <h2 id="$it.year$">$it.year$</h2>
            <section>
                $for(it.images)$
                <img
                    src="/gallery/$it.src$"
                    alt="$it.alt$"
                    title="$it.alt$"
                    width="$it.width$"
                    height="$it.height$"
                    data-external="1"
                />
                $endfor$
            </section>
            $endfor$
        </main>
    </body>
</html>
